[advisories]
ignore = [
  # idna
  # `idna` accepts Punycode labels that do not produce any non-ASCII when decoded.
  # Transitive dependency of jsonschema-valid->url. Only used in testing with known endpoints.
  "RUSTSEC-2024-0421",
  # bincode
  # Bincode is unmaintained
  # The crate is not broken. We're migrating away from it though.
  "RUSTSEC-2025-0141" ,
  # crossbeam-epoch
  # Invalid pointer dereference in fmt::Pointer impl for Atomic and Shared when the underlying pointer is invalid.
  # Not exposed to user code, we use only file paths in rkv.
  "RUSTSEC-2026-0204",
  # libsqlite3-sys
  # `libsqlite3-sys` via C SQLite CVE-2026-119375.
  # We need to coordinate an update of rusqlite/libsqlite3-sys with appservices/m-c.
  "RUSTSEC-2026-0459",
  # basic-toml
  # basic-toml is unmaintained.
  # Transitive dependency, already replaced upstream and waiting for a release.
  "RUSTSEC-2026-0374",
  # chrono
  # chrono is unmaintained.
  # We do still use it, with no immediate requirement to switch away.
  "RUSTSEC-2026-0543",
  # humantime
  # humantime is unmaintained
  # Transitive dependency still in use, with no immediate requirement to switch away.
  "RUSTSEC-2026-0542",
  # url
  # Stack overflow in `Url::origin()` on nested `blob:` URLs
  # Transitive dependency. The broken code is currently not used in our source tree (across dependencies).
  "RUSTSEC-2026-0592"
]
