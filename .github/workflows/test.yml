name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

env:
  MSRV: '1.90'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide-runs:
    name: Decision task
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cargo-changed: ${{ steps.set-flags.outputs.cargo-changed }}
      docs-changed: ${{ steps.set-flags.outputs.docs-changed }}
      kotlin-changed: ${{ steps.set-flags.outputs.kotlin-changed }}
      metrics-changed: ${{ steps.set-flags.outputs.metrics-changed }}
      python-changed: ${{ steps.set-flags.outputs.python-changed }}
      rust-changed: ${{ steps.set-flags.outputs.rust-changed }}
      swift-changed: ${{ steps.set-flags.outputs.swift-changed }}
      yaml-changed: ${{ steps.set-flags.outputs.yaml-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_yaml_from_source_file: .github/changed-files.yaml
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: List changed files
        env:
          ALL_ACTIONS_CHANGED_FILES: ${{ steps.changed-files.outputs.actions_all_changed_files }}
          ALL_CARGO_CHANGED_FILES: ${{ steps.changed-files.outputs.cargo_all_changed_files }}
          ALL_DOCS_CHANGED_FILES: ${{ steps.changed-files.outputs.docs_all_changed_files }}
          ALL_KOTLIN_CHANGED_FILES: ${{ steps.changed-files.outputs.kotlin_all_changed_files }}
          ALL_METRICS_CHANGED_FILES: ${{ steps.changed-files.outputs.metrics_all_changed_files }}
          ALL_PYTHON_CHANGED_FILES: ${{ steps.changed-files.outputs.python_all_changed_files }}
          ALL_RUST_CHANGED_FILES: ${{ steps.changed-files.outputs.rust_all_changed_files }}
          ALL_SWIFT_CHANGED_FILES: ${{ steps.changed-files.outputs.swift_all_changed_files }}
          ALL_YAML_CHANGED_FILES: ${{ steps.changed-files.outputs.yaml_all_changed_files }}
        run: |
          for type in actions cargo docs kotlin metrics python rust swift yaml; do
            echo "Category: $type changed files:"
            changed_files_var=$(echo "ALL_${type^^}_CHANGED_FILES" | tr '-' '_')
            echo "${!changed_files_var}"
          done
      - name: Decide which jobs to run
        id: set-flags
        env:
          CARGO_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.cargo_any_changed == 'true' }}
          DOCS_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.docs_any_changed == 'true' }}
          KOTLIN_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.kotlin_any_changed == 'true' }}
          METRICS_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.metrics_any_changed == 'true' }}
          PYTHON_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.python_any_changed == 'true' }}
          RUST_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.rust_any_changed == 'true' }}
          SWIFT_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.swift_any_changed == 'true' }}
          YAML_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files.outputs.actions_any_changed == 'true' || steps.changed-files.outputs.yaml_any_changed == 'true' }}
        run: |
          echo "cargo-changed=$CARGO_CHANGED" >> $GITHUB_OUTPUT
          echo "docs-changed=$DOCS_CHANGED" >> $GITHUB_OUTPUT
          echo "kotlin-changed=$KOTLIN_CHANGED" >> $GITHUB_OUTPUT
          echo "metrics-changed=$METRICS_CHANGED" >> $GITHUB_OUTPUT
          echo "python-changed=$PYTHON_CHANGED" >> $GITHUB_OUTPUT
          echo "rust-changed=$RUST_CHANGED" >> $GITHUB_OUTPUT
          echo "swift-changed=$SWIFT_CHANGED" >> $GITHUB_OUTPUT
          echo "yaml-changed=$YAML_CHANGED" >> $GITHUB_OUTPUT

  test-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["stable", "1.90"]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install nextest
        run: |
          .github/workflows/crate-ci.sh \
            --git nextest-rs/nextest \
            --crate nextest \
            --tag "cargo-nextest-0.9.150" \
            --filename "cargo-nextest-0.9.150-x86_64-unknown-linux-gnu.tar.gz"

      - name: Create recording user config
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-config"
          printf '[experimental]\nrecord = true\n\n[record]\nenabled = true\n' \
          > "$RUNNER_TEMP/nextest-config/config.toml"
          cat "$RUNNER_TEMP/nextest-config/config.toml"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install deps
        run: |
            sudo apt update
            sudo apt install --yes --no-install-recommends \
              faketime

      - name: Test
        run: |
          export RUST_BACKTRACE=1
          export RUST_LOG=glean_core=debug
          export CARGO_INCREMENTAL=0

          echo "::add-matcher::.github/rust.json"
          cargo nextest run --profile ci --user-config-file "$RUNNER_TEMP/nextest-config/config.toml" --all

      - name: Create portable archive from recorded run
        # Run this step even if the test step fails.
        if: "!cancelled()"
        env:
          RUST_VERSION: ${{ matrix.rust-version }}
        run: |
          cargo nextest store export latest \
            --user-config-file "$RUNNER_TEMP/nextest-config/config.toml" \
            --archive-file "$RUNNER_TEMP/${RUST_VERSION}-test-run-archive.zip"

      - name: Upload portable recording
        # Run this step even if the test step fails.
        if: "!cancelled()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: "${{ runner.temp }}/${{ matrix.rust-version }}-test-run-archive.zip"
          archive: false

      - name: "Test (SQLite)"
        run: |
          export RUST_BACKTRACE=1
          export RUST_LOG=glean_core=debug
          export CARGO_INCREMENTAL=0

          echo "::add-matcher::.github/rust.json"
          cargo nextest run --profile ci --user-config-file "$RUNNER_TEMP/nextest-config/config.toml" --all --features sqlite

      - name: "Create portable archive from recorded run (SQLite)"
        # Run this step even if the test step fails.
        if: "!cancelled()"
        env:
          RUST_VERSION: ${{ matrix.rust-version }}
        run: |
          cargo nextest store export latest \
            --user-config-file "$RUNNER_TEMP/nextest-config/config.toml" \
            --archive-file "$RUNNER_TEMP/${RUST_VERSION}-sqlite-run-archive.zip"

      - name: "Upload portable recording (SQLite)"
        # Run this step even if the test step fails.
        if: "!cancelled()"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: "${{ runner.temp }}/${{ matrix.rust-version }}-sqlite-run-archive.zip"
          archive: false

      - name: Run Rust sample
        run: |
          cargo run -p sample

      - name: Run glean-sym sample
        run: |
          cd samples/glean-sym-test
          make run
          make run-noop

      - name: Compile benchmarks
        if: matrix.rust-version == 'stable'
        run: |
          # Only compile them, don't run them
          cargo benchmark --no-run --locked

      - name: Install the latest version of uv
        if: matrix.rust-version == 'stable'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Setup development environment
        if: matrix.rust-version == 'stable'
        run: |
          uv tool install ziglang==0.16.0
          zig=$(command -v python-zig)
          ln -fs "$zig" ~/.cargo/bin/zig
          cargo install cargo-zigbuild --version 0.23.4 --locked
          rustup target add x86_64-pc-windows-gnu

          zig version
          cargo-zigbuild --version

      - name: Check RLB on Windows x86_64
        if: matrix.rust-version == 'stable'
        run: |
          cargo-zigbuild check --target x86_64-pc-windows-gnu -p glean --examples --tests

      - name: disk-write test
        if: matrix.rust-version == 'stable'
        run: |
          cargo test -p glean-tests --test disk-writes -- --ignored --no-capture

  spelling:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout

      - name: Install aspell
        run: |
          sudo apt update
          sudo apt install aspell aspell-en

      - name: Check documentation spelling
        run: bin/spellcheck.sh list

  docs:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-bin: true

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          enable-cache: "false"
          venv-path: ".venv3.10"

      - name: Setup Python env
        run: |
            make setup-python -B V=1

      - name: Install mdbook-dtmo
        run: |
          cargo install mdbook-dtmo --version 0.15.2
          cp ~/.cargo/bin/mdbook-dtmo ~/.cargo/bin/mdbook

      - name: Version information
        run: |
          rustc --version
          cargo --version
          rustup --version
          mdbook --version

      - name: Build Rust documentation
        run: |
          bin/build-rust-docs.sh

      - name: Generate Python docs
        run: |
          make docs-python

      - name: Install linkchecker
        run: |
          npm install link-checker

      - name: Check internal documentation links
        run: |
          make linkcheck-raw

  test-python:
    runs-on: ${{ matrix.os }}
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true' || needs.decide-runs.outputs.python-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-latest
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.15"
            os: ubuntu-latest
          - python-version: "3.9"
            os: windows-latest
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          venv-path: ".venv${{ matrix.python-version }}"
          no-project: "true"

      - name: Setup Python env
        if: runner.os != 'Windows'
        run: |
            make setup-python -B V=1

      - name: Python tests
        if: runner.os != 'Windows'
        run: |
          make test-python

      - name: "Python tests (Windows)"
        if: runner.os == 'Windows'
        run: |
          uv run python3 -m venv venv
          .\venv\Scripts\pip install --upgrade wheel setuptools
          .\venv\Scripts\pip install -r glean-core\python\requirements_dev.txt
          .\venv\Scripts\pip install -e .

          .\venv\Scripts\py.test -v glean-core\python\tests

  packaging-python-aarch64:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true' || needs.decide-runs.outputs.python-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Set up Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          activate-environment: "true"
          venv-path: ".venv3.13"
          no-project: "true"

      - name: Setup Python env
        run: |
            make setup-python -B V=1
            .venv3.13/bin/pip install ziglang==0.16.0
      - name: Install additional targets
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-pc-windows-gnullvm
      - name: Build Python packages
        run: |
          . .venv3.13/bin/activate

          TARGETS="aarch64-unknown-linux-gnu aarch64-pc-windows-gnullvm"
          for target in $TARGETS; do
            make build-python-wheel GLEAN_BUILD_TARGET="$target" GLEAN_BUILD_EXTRA="--zig"
          done

  test-swift:
    runs-on: glean-macos-arm64
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true' || needs.decide-runs.outputs.swift-changed == 'true'
    steps:
      - *checkout

      # The bundled one _might_ be outdated, which in turn causes problems down the line
      - &install-rustup
        name: Install rustup
        run: |
          exec 1>&2
          set -x

          RUSTUP_VERSION=1.29.2
          RUSTUP_SHA=f7c7e11eb2e07f006e532a8aaac77b32f4527d305ac386c0c633ca6133d35ca9
          TARGET=aarch64-apple-darwin

          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail \
            --output "$RUNNER_TEMP/rustup-init" \
            "https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/${TARGET}/rustup-init"

          echo "$RUSTUP_SHA $RUNNER_TEMP/rustup-init" | sha256sum -c -

          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" --default-toolchain none -y

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: "v2-rust"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'

      - name: Install xcpretty
        run: |
          gem install --no-document xcpretty

      - &dev-env
        name: Show dev environment
        run: |
          exec 1>&2
          set -x

          ruby --version
          gem env
          xcpretty --version || true

          echo "PATH=$PATH"
          echo "HOME=$HOME"
          echo "CARGO_HOME=$CARGO_HOME"
          rustup -vV
          rustc -vV
          cargo -vV

      - &swift-build-environment
        name: Setup build environment
        run: |
          exec 1>&2
          set -x

          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          rustup target list --installed

          # List available devices -- allows us to see what's there
          DEVICES=$(xcrun xctrace list devices 2>&1)
          # Pick a device and start it
          UUID=$(echo "$DEVICES" | grep --max-count=1 'iPhone 17 Simulator (26' | awk -F'[()]' '{print $4}')
          xcrun simctl boot "$UUID"

      - name: Run iOS build
        run: |
          make build-swift

      - name: Upload raw build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: raw_xcodebuild.log
          path: raw_xcodebuild.log

      - name: Run iOS test
        run: |
          make test-swift

      - name: Upload raw test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: raw_xcodetest.log
          path: raw_xcodetest.log

  test-swift-sample:
    runs-on: glean-macos-arm64
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true' || needs.decide-runs.outputs.swift-changed == 'true'
    steps:
      - *checkout

      - *install-rustup

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          prefix-key: "v2-rust"

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'

      - name: Install xcpretty
        run: |
          gem install --no-document xcpretty

      - *dev-env

      - *swift-build-environment

      - name: Build XCFramework archive
        run: |
          make build-xcframework

      - name: Test sample app
        run: |
          make test-ios-sample

      - name: Upload raw test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: raw_sample_xcodetest.log
          path: raw_sample_xcodetest.log

  test-kotlin:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true' || needs.decide-runs.outputs.kotlin-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;30.0.16248370"

      - name: Restrict to Linux builds only
        run: |
            echo "rust.targets=linux-x86-64" > local.properties

      - name: Test
        run: |
          export GRADLE_OPTS="-Xmx2048m"
          export TARGET_CFLAGS="-DNDEBUG"
          ./gradlew --no-daemon :glean:testDebugUnitTest

      - name: Build Android Sample App
        run: |
          export GRADLE_OPTS="-Xmx2048m"
          export TARGET_CFLAGS="-DNDEBUG"
          ./gradlew :glean-sample-app:assembleAndroidTest

      - name: Save test results
        if: failure()
        run: |
            mkdir -p test-results/junit/
            mkdir -p test-results/tests/
            cp -a glean-core/android/build/reports/tests test-results/
            find glean-core/android/build -type f -regex ".*/build/test-results/.*xml" -exec cp {} test-results/junit/ \;

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: gradle-test-failures
          path: test-results/tests

  audit:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-bin: true

      - name: Install cargo-audit
        run: |
          command -v cargo-audit || cargo install cargo-audit --version 0.22.2

      - name: Run cargo audit
        run: |
          make audit

  lint-yaml:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.yaml-changed == 'true'
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install yamllint
        run: |
          uv tool install yamllint

      - name: Lint YAML
        run: |
          make lint-yaml

  lint-licenses:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.cargo-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-bin: true

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9

      - name: Run license check
        run: make check-licenses

      - name: Run dependency ban check
        run: make check-bans

  lint-schema:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    steps:
      - *checkout

      - name: Check vendored schema for upstream updates
        run: |
          bin/update-schema.sh HEAD
          if ! git diff --exit-code HEAD -- glean-core/preview/tests/glean.1.schema.json; then
            echo "===================================="
            echo "Latest schema from upstream changed."
            echo "Please regenerate the file using:"
            echo "    bin/update-schema.sh latest"
            echo "Commit the modified files and push."
            echo "===================================="
            exit 1
          fi

  lint-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "${{ env.MSRV }}"
          components: clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - run: cargo clippy --version

      - name: Clippy
        run: |
          echo "::add-matcher::.github/rust.json"
          make lint-rust

  lint-python:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.python-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Lint Python
        run: make lint-python

  lint-internal-metrics:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.metrics-changed == 'true'
    steps:
      - *checkout

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Internal metrics docs consistency check
        run: |
          make docs-metrics
          if ! git diff --exit-code HEAD -- docs/user/collected-metrics/metrics.md; then
            echo "=================================================="
            echo "metrics.md is different from what's stored in git."
            echo "Please regenerate the file using:"
            echo "    make docs-metrics"
            echo "Commit the modified file and push."
            echo "=================================================="
            exit 1
          fi

  lint-kotlin:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.kotlin-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;30.0.16248370"

      - name: Restrict to Linux builds only
        run: |
            echo "rust.targets=linux-x86-64" > local.properties

      - name: Gradle lint
        run: |
          echo "::add-matcher::.github/ktlint.json"
          ./gradlew --no-daemon lint ktlint detekt

  lint-swift:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.swift-changed == 'true'
    steps:
      - *checkout

      - name: Set up swiftlint
        env:
          SWIFTLINT: "ghcr.io/realm/swiftlint:0.65.1"
        run: |
          docker pull $SWIFTLINT

          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH

          printf 'exec docker run -v `pwd`:`pwd` -w `pwd` %s $*' "$SWIFTLINT" > $RUNNER_TEMP/bin/swiftlint
          chmod +x $RUNNER_TEMP/bin/swiftlint

      - name: Lint Swift
        run: |
          make lint-swift

  fmt-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    steps:
      - *checkout

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "${{ env.MSRV }}"
          components: rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - run: rustfmt --version

      - name: cargo fmt
        run: |
          echo "::add-matcher::.github/rust.json"
          cargo fmt -- --check

  code-security-analysis:
    needs: [decide-runs]
    permissions:
      security-events: write # required for uploading code scanning alerts
    uses: mozilla/ssdlc-actions/.github/workflows/code-security-analysis-public-repo.yml@838591432e264476b97a8ff18549a0e9bdb0dcea # 2026-07-27

  report-result:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - decide-runs
      - audit
      - code-security-analysis
      - docs
      - fmt-rust
      - lint-internal-metrics
      - lint-kotlin
      - lint-licenses
      - lint-python
      - lint-rust
      - lint-schema
      - lint-swift
      - lint-yaml
      - packaging-python-aarch64
      - spelling
      - test-kotlin
      - test-python
      - test-rust
      - test-swift-sample
      - test-swift
    steps:
      - name: Determine result
        run: |
          echo "$RESULTS" | grep -v failure
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
