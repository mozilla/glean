name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

# Drop all default GITHUB_TOKEN permissions; each job declares its own least-privilege set.
permissions: {}

env:
  MSRV: '1.90'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  decide-runs:
    name: Decision task
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs-changed: ${{ steps.set-flags.outputs.docs-changed }}
      rust-changed: ${{ steps.set-flags.outputs.rust-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: changed-files-docs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            **/*.md
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: changed-files-rust
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            **/Cargo.toml
            **/Cargo.lock
            **/*.rs
          base_sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Decide which jobs to run
        id: set-flags
        env:
          DOCS_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files-docs.outputs.any_changed }}
          RUST_CHANGED: ${{ github.ref_name == 'main' || steps.changed-files-rust.outputs.any_changed }}
        run: |
          echo "docs-changed=$DOCS_CHANGED" >> $GITHUB_OUTPUT
          echo "rust-changed=$RUST_CHANGED" >> $GITHUB_OUTPUT

  test-rust:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.rust-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        rust-version: ["stable", "1.90"]
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install nextest
        run: |
          .github/workflows/crate-ci.sh \
            --git nextest-rs/nextest \
            --crate nextest \
            --tag "cargo-nextest-0.9.143" \
            --filename "cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Install deps
        run: |
            sudo apt update
            sudo apt install --yes --no-install-recommends \
              faketime

      - name: Test
        run: |
          export RUST_BACKTRACE=1
          export RUST_LOG=glean_core=debug
          export CARGO_INCREMENTAL=0

          echo "::add-matcher::.github/rust.json"
          make test-rust

      - name: Run Rust sample
        run: |
          cargo run -p sample

      - name: Run glean-sym sample
        run: |
          cd samples/glean-sym-test
          make run
          make run-noop

  spelling:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout

      - name: Install aspell
        run: |
          sudo apt update
          sudo apt install aspell aspell-en

      - name: Check documentation spelling
        run: bin/spellcheck.sh list

  docs:
    runs-on: ubuntu-latest
    needs: [decide-runs]
    if: needs.decide-runs.outputs.docs-changed == 'true'
    steps:
      - *checkout
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          cache-bin: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: |
            glean-core/python/requirements_dev.txt

      - name: Install mdbook-dtmo
        run: |
          cargo install mdbook-dtmo --version 0.15.2
          cp ~/.cargo/bin/mdbook-dtmo ~/.cargo/bin/mdbook

      - name: Version information
        run: |
          rustc --version
          cargo --version
          rustup --version
          mdbook --version

      - name: Build Rust documentation
        run: |
          bin/build-rust-docs.sh

      - name: Generate Python docs
        run: |
          make docs-python

      - name: Install linkchecker
        run: |
          npm install link-checker

      - name: Check internal documentation links
        run: |
          make linkcheck-raw
