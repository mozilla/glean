import groovy.xml.XmlSlurper

def libLicense = providers.gradleProperty("libLicense").get()
def libLicenseUrl = providers.gradleProperty("libLicenseUrl").get()
def libUrl = providers.gradleProperty("libUrl").get()
def libVcsUrl = providers.gradleProperty("libVcsUrl").get()

ext.configurePom = { MavenPublication publication, artifactId ->
    publication.groupId = rootProject.ext.library.groupId
    publication.artifactId = artifactId
    // For mavenLocal publishing workflow, increment the version number every publish.
    publication.version = rootProject.ext.library.version + (rootProject.hasProperty('local') ? '-' + rootProject.property('local') : '')

    publication.pom {
        description = project.ext.description

        licenses {
            license {
                name = libLicense
                url = libLicenseUrl
            }
        }

        developers {
            developer {
                name = 'Mozilla Glean Team'
                email = 'glean-team@mozilla.com'
            }
        }

        scm {
            connection = libVcsUrl
            developerConnection = libVcsUrl
            url = libUrl
        }
    }
}

ext.configurePublish = {
    def theArtifactId = project.ext.artifactId

    // This is a little cludgey, but it seems unlikely to cause a problem
    def isNative = theArtifactId.endsWith("-native")

    publishing {
        publications {
            aar(MavenPublication) { publication ->
                project.afterEvaluate {
                    from components.release
                }

                // If this goes haywire with
                // 'Cannot configure the 'publishing' extension after it has been accessed.',
                // see https://github.com/researchgate/gradle-release/issues/125 and
                // https://stackoverflow.com/q/28020520.
                configurePom(publication, theArtifactId)
                pom {
                    packaging = "aar"

                    def depLicenses = new XmlSlurper().parse(new File("${projectDir}/dependency-licenses.xml"))
                    licenses {
                        depLicenses.license.each { node ->
                            license {
                                name = node.name.text()
                                url = node.url.text()
                            }
                        }
                    }
                }
            }
        }
    }

    def checkMavenArtifacts = tasks.register("checkMavenArtifacts")

    if (isNative) {
        def checkFileTask = tasks.register("checkFilesForMavenArtifact-${theArtifactId}", Exec) {
            dependsOn("publish")
            commandLine "${rootProject.projectDir}/bin/check-artifact.sh", project.layout.buildDirectory.get().asFile, theArtifactId
        }
        checkMavenArtifacts.configure { dependsOn(checkFileTask) }
    }
}
