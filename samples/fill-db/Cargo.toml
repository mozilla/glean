[package]
name = "fill-db"
version = "0.1.0"
edition = "2024"

[dependencies]
env_logger = { version = "0.10.0", default-features = false, features = ["humantime"] }
log = "0.4.28"
glean = { path = "../../glean-core/rlb" }
glean-core = { path = "../../glean-core" }
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.44"

[features]
sqlite = ["glean/sqlite"]
