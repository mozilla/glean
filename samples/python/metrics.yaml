# This file defines the metrics that are recorded by the Glean SDK. They are
# automatically converted to Python code at run time using the `glean_parser`
# PyPI package.

---

$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0

test.metrics:
  sample_boolean:
    type: boolean
    description: |
      Just testing booleans
    bugs:
      - https://bugzilla.mozilla.org/123456789
    data_reviews:
      - N/A
    notification_emails:
      - CHANGE-ME@example.com
    expires: never
    send_in_pings:
      - prototype

party:
  balloons:
    type: object
    description: |
      Just testing objects
    bugs:
      - https://bugzilla.mozilla.org/1839640
    data_reviews:
      - N/A
    notification_emails:
      - CHANGE-ME@example.com
    expires: never
    send_in_pings:
      - prototype
    structure:
      type: array
      items:
        type: object
        properties:
          colour:
            type: string
          diameter:
            type: number

  chooser:
    type: object
    description: |
      Array of key-value elements
    bugs:
      - https://bugzilla.mozilla.org/123456789
    data_reviews:
      - http://example.com/reviews
    notification_emails:
      - CHANGE-ME@example.com
    expires: never
    send_in_pings:
      - prototype
    structure:
      type: array
      items:
        type: object
        properties:
          key:
            type: string
          value:
            oneOf:
              - type: string
              - type: number
              - type: boolean

codegen_test:
  counter: &defaults
    type: counter
    description: |
      A metric for codegen testing --
      no extra data, just setting the defaults
    bugs:
      - https://bugzilla.mozilla.org/TODO
    data_reviews:
      - http://example.com/reviews
    notification_emails:
      - CHANGE-ME@example.com
    expires: never
    send_in_pings:
      - sample

  quantity:
    <<: *defaults
    type: quantity
    unit: apples

  timing_distribution:
    <<: *defaults
    type: timing_distribution
    time_unit: millisecond

  memory_distribution:
    <<: *defaults
    type: memory_distribution
    memory_unit: byte

  custom_distribution:
    <<: *defaults
    type: custom_distribution
    range_min: 0
    range_max: 100
    bucket_count: 100
    histogram_type: linear

  labeled_quantity:
    <<: *defaults
    type: labeled_quantity

  labeled_timing_distribution:
    <<: *defaults
    type: labeled_timing_distribution
    time_unit: millisecond

  labeled_memory_distribution:
    <<: *defaults
    type: labeled_memory_distribution
    memory_unit: byte

  labeled_custom_distribution:
    <<: *defaults
    type: labeled_custom_distribution
    range_min: 0
    range_max: 100
    bucket_count: 100
    histogram_type: exponential
